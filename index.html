<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Casos Constructor Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f7;--card:#ffffff;--ink:#18202e;--mut:#5a6477;--line:#d6dbe4;--soft:#eceff4;
  --brand:#14306e;--brand2:#1f4aa8;--brand-ink:#ffffff;
  --red:#c42b2b;--redbg:#fdecec;--amb:#9a6400;--ambbg:#fff4d4;--grn:#1d7a3e;--grnbg:#e4f4e9;--pur:#7243c9;--purbg:#f0e9fc;--gry:#6b7280;--blu:#1f66d1;--blubg:#e7effc;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.07);
  --f-body:"Public Sans",system-ui,"Segoe UI",Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10141b;--card:#19202a;--ink:#e6e9ef;--mut:#9aa4b4;--line:#303947;--soft:#222a36;
  --brand:#0d1f48;--brand2:#8fa8f0;--brand-ink:#ffffff;
  --red:#ff7a72;--redbg:#3a1e20;--amb:#e0ad3c;--ambbg:#332a14;--grn:#4cc775;--grnbg:#18301f;--pur:#b692ff;--purbg:#2a2140;--gry:#9aa3b2;--blu:#70a6ff;--blubg:#1a2a44;
  --shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* barra superior */
.topbar{background:var(--brand);color:var(--brand-ink);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.topbar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;color:inherit;text-decoration:none}
.logo .mark{width:34px;height:34px;border-radius:8px;background:#fff;color:#14306e;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
.logo small{display:block;font-weight:500;font-size:12px;opacity:.8;letter-spacing:.04em}
.conf{font-size:12px;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px}
main{flex:1;padding:24px 16px 48px}
.w{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
footer{padding:18px 16px 28px;color:var(--mut);font-size:12.5px;text-align:center}
h1{font-size:clamp(24px,4.4vw,32px);font-weight:800;letter-spacing:-.01em}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.meta{color:var(--mut);font-size:14px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand2);color:#fff;border-color:var(--brand2)}
@media (prefers-color-scheme: dark){.btn.pri{color:#10141b}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
button.chip{background:var(--soft);border:1px solid var(--line)}
button.chip:hover{border-color:var(--brand2)}
.empty{color:var(--mut);padding:16px;border:1px dashed var(--line);border-radius:10px}
/* gate */
.gate{max-width:460px;margin:8vh auto 0;text-align:center;padding:32px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate .lock{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:24px}
/* portal */
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 150px;padding:12px 16px}
.stat b{display:block;font-size:26px;font-weight:800;font-family:var(--f-mono)}
.stat span{font-size:12.5px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px}
.f-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card)}
.list{display:flex;flex-direction:column;gap:10px}
.case{display:grid;grid-template-columns:6px 1fr auto;gap:0 16px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:var(--shadow)}
.case:hover{border-color:var(--brand2)}
.case .stripe{background:var(--c)}
.case .main{padding:14px 0;min-width:0;display:flex;flex-direction:column;gap:4px}
.case .t{font-weight:700;font-size:16.5px}
.case .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--mut)}
.case .side{padding:14px 16px 14px 0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;text-align:right}
.open{font-size:13px;font-weight:700;color:var(--brand2)}
/* expediente */
.top{padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.top-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.resumen{max-width:75ch;margin:0}
.alerta{background:var(--ambbg);border-left:4px solid var(--amb);padding:10px 14px;border-radius:6px;font-size:14px}
.alerta b{color:var(--amb)}
.back{font-size:13.5px;color:var(--brand2);text-decoration:none;font-weight:600}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.person{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--c)}
.person:hover{box-shadow:var(--shadow)}
.person .rol{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.person .nom{font-weight:700;font-size:15.5px}
.person .sub{font-size:13px;color:var(--mut)}
.person .more{font-size:12.5px;color:var(--brand2);font-weight:600;margin-top:2px}
.tl-wrap{overflow-x:auto;padding:10px 4px 16px}
.tl{position:relative;display:flex;min-width:max-content;padding-top:8px}
.tl:before{content:"";position:absolute;left:0;right:0;top:19px;height:3px;background:var(--line)}
.ev{width:150px;flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px;background:none;border:0}
.ev .dot{width:22px;height:22px;border-radius:50%;background:var(--c);border:4px solid var(--card);box-shadow:0 0 0 2px var(--c);z-index:1}
.ev .fe{font-family:var(--f-mono);font-size:12.5px;color:var(--c);font-weight:500}
.ev .ti{font-size:13px;line-height:1.35}
.ev:hover .ti{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols>*{min-width:0}
.via{padding:16px;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:6px}
.via h3{font-size:15px;color:var(--c)}
.via .hint{font-size:13px;color:var(--mut);margin:0 0 4px}
.item{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .ck{flex:none;width:18px;height:18px;border-radius:4px;border:2px solid var(--c);margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff}
.item.done .ck{background:var(--c)}
.item.done .tx{text-decoration:line-through;color:var(--mut)}
.flow{display:flex;flex-wrap:wrap;gap:8px}
.fs{flex:1 1 150px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line);border-left:4px solid var(--amb);border-radius:8px;background:var(--card)}
.fs b{display:block;font-family:var(--f-mono);font-size:12px;color:var(--amb);font-weight:500}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:11.5px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.cta{padding:20px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--brand2);border-radius:10px}
/* modal */
dialog{border:0;border-radius:12px;padding:0;background:var(--card);color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,22,.6)}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mut)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.notes{margin:0;padding-left:18px}.notes li{margin:3px 0}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-align:left}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-weight:400;color:var(--ink)}
label.f textarea{min-height:120px;resize:vertical}
#lb{width:min(1000px,calc(100vw - 24px))}
#lb img{width:100%;max-height:75vh;object-fit:contain;background:#000;display:block}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--mut);font-size:13.5px}
.drop b{color:var(--ink);font-size:15px}.drop.over{border-color:var(--brand2);background:var(--blubg)}
.flist{display:flex;flex-direction:column;gap:6px}.fi{display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}.fi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fi button{border:0;background:none;color:var(--red);font-size:13px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}.cmain{display:flex;flex-direction:column;gap:22px;min-width:0}
.aside{position:sticky;top:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 28px);overflow:auto;padding:14px;border-top:4px solid var(--brand2)}
.aside h3{font-size:15px}.ap{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ap .who{display:flex;justify-content:space-between;gap:8px;font-size:13px}.ap .who b{color:var(--ink)}.ap .when{color:var(--mut);font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.ap .tx{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}.ap .files{display:flex;flex-wrap:wrap;gap:6px}
.ap .files .thumb{width:64px;height:64px;aspect-ratio:auto}.fchip{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--card);cursor:pointer}
@media (max-width:1000px){.cgrid{grid-template-columns:1fr}.aside{position:static;max-height:none}}
@media (max-width:720px){.cols{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{font-weight:600}.case{grid-template-columns:6px 1fr}.case .side{grid-column:2;align-items:flex-start;text-align:left;padding:0 0 14px}}
@media print{.cgrid{grid-template-columns:1fr}.aside{position:static;max-height:none}.drop{display:none}}
@media print{@page{size:A4 landscape;margin:10mm}:root{--bg:#fff;--card:#fff;--ink:#18202e;--mut:#5a6477;--line:#d6dbe4;--soft:#eceff4}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff;font-size:12.5px}.topbar{background:#14306e!important}main{padding:12px 0}footer{padding:8px}.cta,.no-print,.back,dialog,.bar input,.f-btn{display:none!important}.tl-wrap{overflow:visible}.tl{min-width:0;flex-wrap:wrap;row-gap:18px}.tl:before{display:none}.ev{width:auto;flex:1 1 0;min-width:0;padding:0 4px}.tl{flex-wrap:nowrap}.sec-h>.meta{display:none}.card,.item,.fs,.person,.case,.sec{break-inside:avoid}.people{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1fr 1fr}.case,.top,.stat{box-shadow:none}.more,.open{display:none}}
.pdf-print-note{font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <a class="logo" id="home" href="#casos"><span class="mark">CC</span><span>Constructor Center<small>Registro de casos</small></span></a>
  <span id="ubox" style="display:flex;gap:10px;align-items:center"></span>
</div></header>
<main><div class="w" id="app"><div class="empty">Cargando…</div></div></main>
<footer>Uso interno y confidencial. No compartas tu usuario ni tu clave.</footer>

<dialog id="dlg"><div class="mh"><div id="dlg-h"></div><button class="x" data-close aria-label="Cerrar">×</button></div><div class="mb" id="dlg-b"></div></dialog>
<dialog id="lb"><div class="mh"><div id="lb-h" style="font-weight:700"></div><button class="x" data-close aria-label="Cerrar">×</button></div><img id="lb-img" alt=""><div class="mb meta" id="lb-cap"></div></dialog>
<dialog id="ap">
  <form id="apf">
    <div class="mh"><div><h3 style="font-size:18px">Subir información</h3><div class="meta" style="font-size:13px">Queda registrado en el expediente con tu nombre, la fecha y la hora.</div></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="mb">
      <div class="meta" style="font-size:14px">Aporta como: <b id="ap-quien" style="color:var(--ink)"></b></div>
      <label class="f">Fecha del hecho (si aplica)<input id="ap-fecha" type="date"></label>
      <label class="f">Qué quieres informar<textarea id="ap-txt" placeholder="Qué pasó, quién estaba, frases textuales…"></textarea></label>
      <div class="drop" id="ap-drop" tabindex="0" role="button" aria-label="Agregar archivos"><b>Arrastra aquí fotos, videos o documentos</b><span>o toca para elegirlos</span><input type="file" id="ap-files" multiple hidden></div>
      <div id="ap-list" class="flist"></div>
      <div id="ap-err" style="color:var(--red);font-size:13.5px"></div>
    </div>
    <div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri" id="ap-ok">Subir información</button></div>
  </form>
</dialog>

<script>
(function(){
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='style')e.style.cssText=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(v!=null&&v!==false)e.setAttribute(x,v)}for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const TIPOS={karin:{n:'Ley Karin',c:'var(--pur)',bg:'var(--purbg)'},accidente:{n:'Accidente',c:'var(--red)',bg:'var(--redbg)'},incidente:{n:'Incidente',c:'var(--amb)',bg:'var(--ambbg)'},investigacion:{n:'Investigación',c:'var(--blu)',bg:'var(--blubg)'},otro:{n:'Otro',c:'var(--gry)',bg:'var(--soft)'}};
const CATS={ingreso:{n:'Ingreso',c:'var(--blu)'},conducta:{n:'Conducta',c:'var(--red)'},jefatura:{n:'Jefatura',c:'var(--pur)'},antecedente:{n:'Antecedente',c:'var(--gry)'},reporte:{n:'Reporte',c:'var(--grn)'},relato:{n:'Relato',c:'var(--brand2)'},evidencia:{n:'Evidencia',c:'var(--amb)'}};
const ROLC={informante:'var(--blu)',senalado:'var(--red)',jefatura:'var(--pur)',testigo:'var(--grn)',otro:'var(--gry)'};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const app=$('#app');
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)c.closest('dialog').close()});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));

/* ---- cripto ---- */
const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function abrir(id,llave){
  const r=await fetch(id+'.enc',{cache:'no-store'});if(!r.ok)throw new Error('nf');
  const raw=b64((await r.text()).trim());const k=await crypto.subtle.importKey('raw',b64(llave),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},k,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function gate(msg){
  document.title='Casos Constructor Center';
  app.replaceChildren(el('div',{class:'card gate'},el('div',{class:'lock'},'🔒'),el('h1',{style:'font-size:22px'},'Acceso restringido'),el('p',{class:'meta',style:'margin:0'},msg||'Para ver esta información necesitas el enlace de acceso que te envió el asesor a cargo. Ábrelo directamente desde ese mensaje.')));
}

/* ---- util ---- */
function fechaTxt(r){if(r.fechaTexto)return r.fechaTexto;if(!r.fecha)return '';const[y,m,d]=r.fecha.split('-');if(r.aprox==='anio')return y;if(r.aprox==='mes')return (MES[+m-1]||m)+'-'+y;return d+'-'+m+'-'+y}
function fmt(iso){if(!iso)return '';const[y,m,d]=iso.slice(0,10).split('-');return d+'-'+m+'-'+y}
function openDlg(d){if(!d.open)d.showModal()}
function pdf(){document.querySelectorAll('dialog[open]').forEach(d=>d.close());const t=document.title;document.title=t.replace(/[·:]/g,'').replace(/\s+/g,' ').trim()+' '+new Date().toLocaleDateString('es-CL').replace(/\//g,'-');setTimeout(()=>{window.print();document.title=t},50)}

/* ---- portal ---- */
let PORTAL=null,PKEY='';
function renderPortal(P){
  document.title='Casos Constructor Center';
  let filtro='todos';const casos=P.casos||[];
  const stats=el('div',{class:'stats'});const fil=el('div',{class:'bar'});const q=el('input',{class:'search',type:'search',placeholder:'Buscar por nombre, empresa o sucursal…','aria-label':'Buscar casos'});const list=el('div',{class:'list'});
  function draw(){
    const cnt={todos:casos.length};casos.forEach(c=>cnt[c.tipo]=(cnt[c.tipo]||0)+1);
    fil.replaceChildren(...[['todos','Todos'],...Object.entries(TIPOS).map(([k,v])=>[k,v.n])].filter(([k])=>k==='todos'||cnt[k]).map(([k,n])=>el('button',{class:'f-btn','aria-pressed':String(filtro===k),onclick:()=>{filtro=k;draw()}},n,el('span',{class:'mono',style:'opacity:.7'},cnt[k]||0))));
    const ab=casos.filter(c=>c.estado!=='Cerrado').length;
    stats.replaceChildren(el('div',{class:'card stat'},el('b',{},casos.length),el('span',{},'Casos registrados')),el('div',{class:'card stat'},el('b',{},ab),el('span',{},'Abiertos')),el('div',{class:'card stat'},el('b',{},casos.length-ab),el('span',{},'Cerrados')));

async function achicar(f){

    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}

/* ---- sesión con usuario y clave ---- */
let USER=null;const enc=new TextEncoder();

function renderLogin(msg){
  document.title='Casos Constructor Center';
  const u=el('input',{id:'lg-u',autocomplete:'username',required:true,autocapitalize:'none',spellcheck:'false'});
  const p=el('input',{id:'lg-p',type:'password',autocomplete:'current-password',required:true});

  const btn=el('button',{class:'btn pri',style:'justify-content:center;width:100%'},'Ingresar');
  const form=el('form',{class:'card gate',style:'text-align:left;align-items:stretch'},
    el('div',{style:'text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px'},el('div',{class:'lock'},'🔒'),el('h1',{style:'font-size:22px'},'Ingreso al registro de casos'),el('p',{class:'meta',style:'margin:0'},'Usa el usuario y la clave que te entregó el asesor.')),
    el('label',{class:'f'},'Usuario',u),el('label',{class:'f'},'Clave',p),el('label',{for:'lg-r',style:'display:flex;gap:8px;align-items:center;font-size:14px'},rec,'Recordarme en este equipo'),err,btn);

async function route(){

  const h=decodeURIComponent(location.hash.slice(1));
  if(!USER){renderLogin();return}
  try{
    if(h.startsWith('caso/')){const c=(USER.casos||[]).find(x=>x.id===h.slice(5));if(!c){location.hash='casos';return}
      const C=await abrir(c.id,c.llave);C.usuario=USER.nombre;C.id=c.id;renderCaso(C,(USER.casos||[]).length>1?'#casos':null);return}
